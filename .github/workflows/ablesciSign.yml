name: AbleSci Auto Sign

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'  # UTC时间 (北京时间 8:00)

permissions:
  contents: write

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with: 
          fetch-depth: '0'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AbleSci Sign
        id: sign
        run: |
          python ablesci.py > output.log
          LOG_CONTENT=$(cat output.log)
          echo "LOG_CONTENT<<EOF" >> $GITHUB_ENV
          echo "$LOG_CONTENT" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
        env:
          GITHUB_ACTIONS: true
          ABLESCI_ACCOUNTS: ${{ secrets.ABLESCI_ACCOUNTS }}
          # 通知服务 (按需启用)
          # SCKEY: ${{ secrets.SCKEY }}                      # Server酱
          # XZKEY: ${{ secrets.XZKEY }}                      # 息知
          # PUSH_PLUS_TOKEN: ${{ secrets.PUSH_PLUS_TOKEN }}  # PushPlus

      - name: Display Log
        run: |
          echo "$LOG_CONTENT"

      - name: Keep actions alive
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          PREV_COMMIT=$(git log --grep="Keep actions alive (no code change)" --format="%H" -n 1)
          if [ -n "$PREV_COMMIT" ]; then
            BRANCH=$(git rev-parse --abbrev-ref HEAD)
            git rebase --onto $PREV_COMMIT^ $PREV_COMMIT $BRANCH
            echo "Removed previous keep-alive commit"
          else
            echo "No previous keep-alive commit found"
          fi
          git commit --allow-empty -m "Keep actions alive (no code change)"
          echo "Created new keep-alive commit"
          git push origin main --force-with-lease
